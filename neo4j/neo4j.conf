# =============================================================================
# NEUROTWIN OS — Neo4j 5.x Community Configuration
# =============================================================================
# This file overrides the image default neo4j.conf.
# CRITICAL: server.directories.logs is intentionally ABSENT here.
# The docker-entrypoint.sh writes it ONCE via Docker VOLUME detection.
# If present here AND generated by entrypoint → "declared multiple times" crash.
# =============================================================================

# ── Memory (Neo4j 5.x server.* format, NOT deprecated dbms.*) ───────────────
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1G
server.memory.pagecache.size=256m

# ── Network ──────────────────────────────────────────────────────────────────
server.default_listen_address=0.0.0.0
server.bolt.enabled=true
server.bolt.listen_address=0.0.0.0:7687
server.http.enabled=true
server.http.listen_address=0.0.0.0:7474
server.https.enabled=false

# ── Security ─────────────────────────────────────────────────────────────────
dbms.security.auth_enabled=true

# ── Transaction & Query ──────────────────────────────────────────────────────
db.transaction.timeout=60s
db.query.timeout=60s

# ── Data directories (only /data — /logs intentionally omitted) ─────────────
server.directories.data=/data
