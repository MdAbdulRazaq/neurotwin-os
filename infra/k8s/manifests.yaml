---
# ── Namespace ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: neurotwin
  labels:
    app.kubernetes.io/name: neurotwin
    environment: production

---
# ── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: neurotwin-config
  namespace: neurotwin
data:
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "claude-3-5-sonnet-20241022"
  EMBEDDING_MODEL: "text-embedding-3-small"
  REDIS_URL: "redis://redis-service:6379/0"
  NEO4J_URI: "bolt://neo4j-service:7687"

---
# ── API Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurotwin-api
  namespace: neurotwin
  labels:
    app: neurotwin-api
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neurotwin-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  template:
    metadata:
      labels:
        app: neurotwin-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: neurotwin-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ghcr.io/yourorg/neurotwin-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: neurotwin-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neurotwin-secrets
                  key: DATABASE_URL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neurotwin-secrets
                  key: ANTHROPIC_API_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neurotwin-secrets
                  key: SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neurotwin-secrets
                  key: OPENAI_API_KEY
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neurotwin-secrets
                  key: PINECONE_API_KEY
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neurotwin-secrets
                  key: ELEVENLABS_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

---
# ── API Service ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: neurotwin
spec:
  selector:
    app: neurotwin-api
  ports:
    - port: 80
      targetPort: 8000
      name: http
  type: ClusterIP

---
# ── API HPA ───────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurotwin-api-hpa
  namespace: neurotwin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurotwin-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ── Perception Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurotwin-perception
  namespace: neurotwin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neurotwin-perception
  template:
    metadata:
      labels:
        app: neurotwin-perception
    spec:
      containers:
        - name: perception
          image: ghcr.io/yourorg/neurotwin-perception:latest
          ports:
            - containerPort: 8001
          env:
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neurotwin-secrets
                  key: DEEPGRAM_API_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

---
# ── Perception Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: perception-service
  namespace: neurotwin
spec:
  selector:
    app: neurotwin-perception
  ports:
    - port: 80
      targetPort: 8001

---
# ── Web Frontend Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurotwin-web
  namespace: neurotwin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neurotwin-web
  template:
    metadata:
      labels:
        app: neurotwin-web
    spec:
      containers:
        - name: web
          image: ghcr.io/yourorg/neurotwin-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.neurotwin.ai"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ── Web Service ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: neurotwin
spec:
  selector:
    app: neurotwin-web
  ports:
    - port: 80
      targetPort: 3000

---
# ── Ingress ───────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neurotwin-ingress
  namespace: neurotwin
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.neurotwin.ai
        - api.neurotwin.ai
      secretName: neurotwin-tls
  rules:
    - host: app.neurotwin.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
    - host: api.neurotwin.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80

---
# ── ServiceAccount ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neurotwin-sa
  namespace: neurotwin
