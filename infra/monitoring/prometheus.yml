global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'neurotwin-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'neurotwin-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: 'neurotwin-perception'
    static_configs:
      - targets: ['perception:8001']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
